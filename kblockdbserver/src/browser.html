<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kBlockDB browser</title>
<link rel="stylesheet" href="browser.css">
</head>
<body>
  <h1>kBlockDB</h1>
  <p class="sub">Every populated cell in the selected database, sorted ascending by coordinate. Click a row for its full keys and values.</p>

  <div class="query-bar">
    <input id="query" type="text" placeholder="SELECT * WHERE material = 'stone'  (read-only -- SELECT only)" autocomplete="off" spellcheck="false">
    <button id="run-query" type="button">Run</button>
  </div>
  <div id="query-status" class="muted"></div>

  <div class="toolbar">
    <select id="database" aria-label="Database"></select>
    <input id="search" type="search" placeholder="Search by coordinate, key, or value...">
  </div>

  <table>
    <thead>
      <tr>
        <th>Coordinate</th>
        <th># keys</th>
        <th>Created</th>
        <th>Modified</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="empty" class="empty" hidden>No cells match.</p>

  <div class="pager">
    <button id="prev" type="button">&larr; Prev</button>
    <span id="page-info" class="muted"></span>
    <button id="next" type="button">Next &rarr;</button>
  </div>

  <div id="modal-backdrop">
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Key</th>
            <th>Value</th>
            <th>Created</th>
            <th>Modified</th>
            <th>Version</th>
          </tr>
        </thead>
        <tbody id="modal-rows"></tbody>
      </table>
    </div>
  </div>

<script>
(function () {
  "use strict";

  const state = { database: "", page: 1, pageSize: 50, search: "", queryMode: false };

  const rowsBody = document.getElementById("rows");
  const emptyMsg = document.getElementById("empty");
  const pageInfo = document.getElementById("page-info");
  const databaseSelect = document.getElementById("database");
  const searchInput = document.getElementById("search");
  const queryInput = document.getElementById("query");
  const runQueryBtn = document.getElementById("run-query");
  const queryStatus = document.getElementById("query-status");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const backdrop = document.getElementById("modal-backdrop");
  const modalTitle = document.getElementById("modal-title");
  const modalRows = document.getElementById("modal-rows");
  const modalClose = document.getElementById("modal-close");

  // Every helper below builds DOM nodes via createElement/textContent,
  // never innerHTML, for anything derived from cell data (coordinates are
  // safe -- they're always JSON numbers -- but key names and string
  // values are arbitrary, attacker- or fat-finger-controllable content
  // stored in the world, so they're treated as untrusted text, never markup).

  function cell(tag, text) {
    const el = document.createElement(tag);
    if (text !== undefined) {
      el.textContent = text;
    }
    return el;
  }

  function fmtTime(ms) {
    if (!ms && ms !== 0) {
      return "";
    }
    return new Date(ms).toISOString().replace("T", " ").replace("Z", "");
  }

  function fmtValue(v) {
    if (!v) {
      return "";
    }
    return String(v.value) + " (" + v.type + ")";
  }

  async function loadDatabases() {
    let resp;
    try {
      resp = await fetch("rest/databases");
    } catch (e) {
      renderError("request failed: " + e);
      return;
    }
    if (!resp.ok) {
      renderError(resp.status + ": " + resp.statusText);
      return;
    }
    const data = await resp.json();
    const names = data.databases || [];

    databaseSelect.textContent = "";
    names.forEach(function (name) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      databaseSelect.appendChild(opt);
    });

    if (names.length === 0) {
      state.database = "";
      databaseSelect.disabled = true;
      searchInput.disabled = true;
      queryInput.disabled = true;
      runQueryBtn.disabled = true;
      renderError("No databases yet.");
      return;
    }

    databaseSelect.disabled = false;
    searchInput.disabled = false;
    queryInput.disabled = false;
    runQueryBtn.disabled = false;
    // Keep the previously selected database if it's still around (e.g.
    // after it's reloaded via the dropdown change handler below);
    // otherwise default to the first one.
    state.database = names.includes(state.database) ? state.database : names[0];
    databaseSelect.value = state.database;
    load();
  }

  async function load() {
    state.queryMode = false;
    if (!state.database) {
      return;
    }
    const params = new URLSearchParams({
      db: state.database,
      page: String(state.page),
      page_size: String(state.pageSize),
      search: state.search,
    });
    let resp;
    try {
      resp = await fetch("rows?" + params.toString());
    } catch (e) {
      renderError("request failed: " + e);
      return;
    }
    if (!resp.ok) {
      let detail = resp.statusText;
      try {
        const body = await resp.json();
        if (body && body.error) {
          detail = body.error;
        }
      } catch (e) {
        // response wasn't JSON -- fall back to the plain status text above
      }
      renderError(resp.status + ": " + detail);
      return;
    }
    const data = await resp.json();
    renderRows(data);
  }

  function setQueryStatus(message, isError) {
    queryStatus.textContent = message || "";
    queryStatus.classList.toggle("error", !!isError);
  }

  // Runs whatever's in `#query` as a `SELECT` against `state.database` via
  // `POST /query` (see `browser.rs`'s `run_select` -- SET/UPDATE/DELETE are
  // refused server-side regardless of account, so this can never mutate
  // anything). An empty box just exits query mode back to the normal
  // paged/searchable listing.
  async function runQuery() {
    const text = queryInput.value.trim();
    if (!text) {
      state.queryMode = false;
      setQueryStatus("");
      load();
      return;
    }
    if (!state.database) {
      setQueryStatus("select a database first", true);
      return;
    }
    setQueryStatus("running...");
    let resp;
    try {
      resp = await fetch("query", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ db: state.database, query: text }),
      });
    } catch (e) {
      setQueryStatus("request failed: " + e, true);
      return;
    }
    let body = null;
    try {
      body = await resp.json();
    } catch (e) {
      // response wasn't JSON -- body stays null, resp.statusText below
    }
    if (!resp.ok) {
      const detail = body && body.error ? body.error : resp.statusText;
      setQueryStatus(resp.status + ": " + detail, true);
      return;
    }
    state.queryMode = true;
    renderQueryResult(body);
  }

  // `data` is a `kblockdbserver` `QueryResponse` -- `rows` for a plain
  // `SELECT`, `aggregates` for `SELECT count(*)`/`sum(...)`/etc. Never
  // `affected_cells`: that's only for SET/UPDATE/DELETE, which never reach
  // this page at all (see `runQuery`).
  function renderQueryResult(data) {
    if (data.aggregates) {
      renderAggregates(data.aggregates);
      return;
    }
    const rows = (data.rows || []).map(function (row) {
      const created = row.values.map(function (v) { return v.created_at_ms; });
      const modified = row.values.map(function (v) { return v.modified_at_ms; });
      return {
        coord: row.coord,
        key_count: row.values.length,
        created_at_ms: created.length ? Math.min.apply(null, created) : 0,
        modified_at_ms: modified.length ? Math.max.apply(null, modified) : 0,
        keys: row.values,
      };
    });
    renderRows({ rows: rows, total_rows: rows.length, page: 1, total_pages: 1 });
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    setQueryStatus(rows.length + " row" + (rows.length === 1 ? "" : "s"));
  }

  function renderAggregates(aggregates) {
    rowsBody.textContent = "";
    emptyMsg.hidden = true;
    pageInfo.textContent = "";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    queryStatus.textContent = "";
    queryStatus.classList.remove("error");
    aggregates.forEach(function (a) {
      const value = a.value === null || a.value === undefined ? "null" : String(a.value);
      queryStatus.appendChild(cell("div", a.label + " = " + value));
    });
  }

  function renderError(message) {
    rowsBody.textContent = "";
    emptyMsg.hidden = false;
    emptyMsg.textContent = message;
    pageInfo.textContent = "";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
  }

  function renderRows(data) {
    rowsBody.textContent = "";
    emptyMsg.hidden = data.rows.length !== 0;
    emptyMsg.textContent = "No cells match.";

    data.rows.forEach(function (row) {
      const tr = document.createElement("tr");
      tr.className = "row";
      tr.tabIndex = 0;

      const coordTd = cell("td", row.coord.join(","));
      coordTd.className = "coord";
      tr.appendChild(coordTd);
      tr.appendChild(cell("td", String(row.key_count)));
      tr.appendChild(cell("td", fmtTime(row.created_at_ms)));
      tr.appendChild(cell("td", fmtTime(row.modified_at_ms)));

      tr.addEventListener("click", function () {
        openModal(row);
      });
      tr.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openModal(row);
        }
      });

      rowsBody.appendChild(tr);
    });

    const totalPages = Math.max(1, data.total_pages);
    pageInfo.textContent =
      "page " + data.page + " of " + totalPages + " (" + data.total_rows + " cell" +
      (data.total_rows === 1 ? "" : "s") + ")";
    prevBtn.disabled = data.page <= 1;
    nextBtn.disabled = data.page >= totalPages;
  }

  function openModal(row) {
    modalTitle.textContent = "(" + row.coord.join(",") + ")";
    modalRows.textContent = "";
    row.keys.forEach(function (k) {
      const tr = document.createElement("tr");
      const keyTd = document.createElement("td");
      keyTd.appendChild(cell("code", k.key));
      tr.appendChild(keyTd);
      tr.appendChild(cell("td", fmtValue(k.value)));
      tr.appendChild(cell("td", fmtTime(k.created_at_ms)));
      tr.appendChild(cell("td", fmtTime(k.modified_at_ms)));
      tr.appendChild(cell("td", String(k.version)));
      modalRows.appendChild(tr);
    });
    backdrop.classList.add("open");
  }

  function closeModal() {
    backdrop.classList.remove("open");
  }

  modalClose.addEventListener("click", closeModal);
  backdrop.addEventListener("click", function (e) {
    if (e.target === backdrop) {
      closeModal();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      closeModal();
    }
  });

  databaseSelect.addEventListener("change", function () {
    state.database = databaseSelect.value;
    state.page = 1;
    state.search = "";
    searchInput.value = "";
    queryInput.value = "";
    setQueryStatus("");
    load();
  });

  let searchTimer = null;
  searchInput.addEventListener("input", function () {
    queryInput.value = "";
    setQueryStatus("");
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.search = searchInput.value;
      state.page = 1;
      load();
    }, 250);
  });

  runQueryBtn.addEventListener("click", runQuery);
  queryInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      runQuery();
    }
  });

  prevBtn.addEventListener("click", function () {
    if (state.page > 1) {
      state.page -= 1;
      load();
    }
  });
  nextBtn.addEventListener("click", function () {
    state.page += 1;
    load();
  });

  loadDatabases();
})();
</script>
</body>
</html>
