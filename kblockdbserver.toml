# Default kblockdbserver config, checked in so `cargo run -p kblockdbserver` and
# ./run.sh work out of the box.
#
# admin_password/the [[users]] entry are placeholders for local development
# only. Change them (and don't commit your real ones) before running this
# anywhere reachable by anyone you don't trust with access to the world.
http_addr = "127.0.0.1:8080"
binary_addr = "127.0.0.1:8081"
data_dir = "data"
max_concurrent_disk_ops = 32
admin_password = "changeme"
max_cached_chunks = 10000

# Only matters the first time a world is created at data_dir above --
# reopening an existing one reads its real shape from its world.txt and
# ignores these (World::open does, not create).
[worldparameters]
axes = 4
world_dim = 10000
chunk_size = 32

[[users]]
username = "user"
password = "changeme"
