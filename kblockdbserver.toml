# Default kblockdbserver config, checked in so `cargo run -p kblockdbserver` and
# ./run.sh work out of the box.
#
# admin_password/the [[users]] entry are placeholders for local development
# only. Change them (and don't commit your real ones) before running this
# anywhere reachable by anyone you don't trust with access to its databases --
# the server listens on every interface, so that includes anyone who can
# reach this host on the ports below.
http_port = 8080
binary_port = 8081
data_dir = "data"
max_concurrent_disk_ops = 32
admin_password = "changeme"
max_cached_chunks = 10000
compression = false

# Default shape for a database created without an explicit shape of its own
# (see /rest/databases in docs/kblockdbserver.md) -- no database is ever
# created automatically. Reopening an existing database, or creating one
# with an explicit shape, ignores these.
[worldparameters]
axes = 4
world_dim = 10000
chunk_size = 32

[[users]]
username = "user"
password = "changeme"

# Clustering (see docs/clustering.md) is off by default -- uncomment to
# replicate this server's local writes to one or more peers. cluster_secret
# must be set (and match every peer's own) for either direction of the peer
# link to work; change it from this placeholder before using this for real.
# peer_port = 8082
# cluster_secret = "changeme"
#
# [[peers]]
# address = "10.0.0.2:8082"
