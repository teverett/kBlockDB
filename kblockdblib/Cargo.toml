[package]
name = "kblockdblib"
version = "0.1.0"
edition = "2021"

# One external dependency, `zstd`, and only for the optional `compression`
# flag (see `World::with_compression`): the chunk format itself is still a
# compact, hand-rolled binary layout, and compression is a transparent
# wrapper over it. `kblockdbserver` (a separate crate in this workspace)
# builds on top of this library and is free to take on its own
# dependencies -- that's a choice about the server, not about the storage
# engine underneath it.

[lib]
name = "kblockdblib"
path = "src/lib.rs"

[[bin]]
name = "kblockdblib"
path = "src/main.rs"

[dependencies]
zstd = "0.14.0"
