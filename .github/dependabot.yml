version: 2
updates:
  # All four Rust crates are one Cargo workspace rooted here.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/client/java"
    schedule:
      interval: "weekly"
    groups:
      java-client-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/client/python"
    schedule:
      interval: "weekly"
    groups:
      python-client-dependencies:
        patterns:
          - "*"

  # Keeps every action used by the Rust, Java, and Python workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
