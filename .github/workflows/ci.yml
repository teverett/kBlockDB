name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, fmt, clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Run kblockdblib demo binary (smoke test)
        run: |
          rm -rf "$RUNNER_TEMP/kblockdblib_ci_data"
          ./target/debug/kblockdblib "$RUNNER_TEMP/kblockdblib_ci_data"

      - name: Run kblockdbserver and kblockdbcli (smoke test)
        run: |
          rm -rf "$RUNNER_TEMP/kblockdbserver_ci_data"
          cat > "$RUNNER_TEMP/kblockdbserver_ci_config.toml" <<'EOF'
          admin_password = "ci-smoke-test-password"
          EOF
          ./target/debug/kblockdbserver --data-dir "$RUNNER_TEMP/kblockdbserver_ci_data" --addr 127.0.0.1:8099 \
            --config "$RUNNER_TEMP/kblockdbserver_ci_config.toml" &
          server_pid=$!

          ready=0
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8099/health > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "kblockdbserver never became ready" >&2
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi

          curl -sf http://127.0.0.1:8099/health
          echo
          curl -sf -u admin:ci-smoke-test-password -X PUT http://127.0.0.1:8099/cells/1,2,3/material \
            -H 'content-type: application/json' -d '{"type":"str","value":"stone"}'
          curl -sf -u admin:ci-smoke-test-password http://127.0.0.1:8099/cells/1,2,3/material
          echo

          echo "kblockdbcli:"
          ./target/debug/kblockdbcli --url http://127.0.0.1:8099 --user admin \
            --password ci-smoke-test-password set 4,5,6 material str dirt
          ./target/debug/kblockdbcli --url http://127.0.0.1:8099 --user admin \
            --password ci-smoke-test-password get 4,5,6 material
          ./target/debug/kblockdbcli --url http://127.0.0.1:8099 --user admin \
            --password ci-smoke-test-password remove 4,5,6 material

          kill "$server_pid"

      - name: Run kblockdbperf (smoke test)
        run: |
          ./target/debug/kblockdbperf --cells 10 --concurrency 1,4 --ops-per-client 5 \
            --region-edges 2,4 --region-reps 1 --instances 2
