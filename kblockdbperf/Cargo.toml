[package]
name = "kblockdbperf"
version = "0.1.0"
edition = "2021"

# A performance test suite that drives a real kblockdbserver process (or several)
# over real HTTP -- not a microbenchmark of kblockdblib's internals, a measurement of
# what a client actually experiences. Like kblockdbserver, this crate takes on
# whatever dependencies make that straightforward; the dependency-free
# constraint was specific to kblockdblib's storage format.

[[bin]]
name = "kblockdbperf"
path = "src/main.rs"

[dependencies]
# HTTP-only (no https:// target here), so no TLS backend is pulled in.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for its published `wire` module (the binary protocol's wire format)
# -- see `binary_client.rs`. Everything else about that crate (its own
# HTTP server, auth, ...) is irrelevant here.
kblockdbserver = { path = "../kblockdbserver" }
