[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kblockdb-client"
version = "0.1.0"
description = "Dependency-free Python 3 client for kBlockDB's binary protocol"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kblockdb = ["py.typed"]
